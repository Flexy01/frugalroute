# Tiers are ordered cheapest -> strongest. Fallback only moves forward.
# Any OpenAI-compatible endpoint works; only base_url changes.
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
log_path = "~/.frugalroute/calls.jsonl"
timeout = 60

[[tiers]]
name = "cheap"
models = ["gpt-4o-mini", "gpt-4.1-mini"]

[[tiers]]
name = "standard"
models = ["gpt-4o", "gpt-4.1"]

[[tiers]]
name = "strong"
models = ["o3"]

# USD per 1M tokens. Every model listed above needs an entry here.
[pricing."gpt-4o-mini"]
input = 0.15
output = 0.60

[pricing."gpt-4.1-mini"]
input = 0.40
output = 1.60

[pricing."gpt-4o"]
input = 2.50
output = 10.00

[pricing."gpt-4.1"]
input = 2.00
output = 8.00

[pricing."o3"]
input = 2.00
output = 8.00
